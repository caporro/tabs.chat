AWSTemplateFormatVersion: '2010-09-09'
Description: 'tabs.chat - Static hosting on S3 with CloudFront CDN and Origin Access Control (OAC)'

Parameters:
  DomainName:
    Type: String
    Default: tabs.chat
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:us-east-1:[0-9]{12}:certificate/.*'
    Description: Issued ACM certificate in us-east-1 covering the apex and www redirect.
  ProjectName:
    Type: String
    Default: 'tabs-chat-web'
    Description: 'Base name for S3 bucket and stack resources'

Resources:
  # 1. S3 Private Bucket for static website assets
  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  AppCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-revalidate'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  AppResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-headers'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  CanonicalHostRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-canonical-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the canonical apex, preserving path and query.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.headers.host.value.toLowerCase() !== 'www.${DomainName}') return request;
          var query = [];
          Object.keys(request.querystring || {}).forEach(function(key) {
            var item = request.querystring[key];
            (item.multiValue || [item]).forEach(function(value) { query.push(key + '=' + value.value); });
          });
          return {
            statusCode: 308,
            statusDescription: 'Permanent Redirect',
            headers: {
              location: { value: 'https://${DomainName}' + request.uri + (query.length ? '?' + query.join('&') : '') },
              'cache-control': { value: 'public, max-age=3600' }
            }
          };
        }

  # 2. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'CloudFront distribution for tabs.chat'
        DefaultRootObject: 'index.html'
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: 'http2and3'
        PriceClass: 'PriceClass_100' # US, Canada, Europe (cheapest and fastest for typical use)
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: '' # Empty because we are using OAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: !Ref AppCachePolicy
          ResponseHeadersPolicyId: !Ref AppResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalHostRedirect.FunctionARN

  # 4. S3 Bucket Policy allowing read-only access exclusively from CloudFront OAC
  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: 'cloudfront.amazonaws.com'
            Action: 's3:GetObject'
            Resource: !Sub '${AppBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  BucketName:
    Description: 'S3 Bucket Name'
    Value: !Ref AppBucket
  DistributionId:
    Description: 'CloudFront Distribution ID'
    Value: !Ref CloudFrontDistribution
  DistributionURL:
    Description: Canonical application URL
    Value: !Sub 'https://${DomainName}'
  CloudFrontDomain:
    Description: DNS target for the apex ALIAS and www CNAME
    Value: !GetAtt CloudFrontDistribution.DomainName
