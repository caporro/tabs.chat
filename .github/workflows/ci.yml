name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Scan committed history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir "$RUNNER_TEMP/gitleaks" --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt
          cd "$RUNNER_TEMP/gitleaks"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --config .gitleaks.toml --log-opts=--all
      - run: npm ci --ignore-scripts
      - run: test -x "$CHROME_PATH"
      - run: npm run test:agents
      - run: npm run test:reasoning
      - run: npm run test:providers
      - run: node scripts/test_connection_access.mjs
      - run: npm run test:release
      - run: npm run test:dev
      - run: npm run test:ui
      - run: npm run test:resources
      - run: npm run build
      - run: npm run build:hosted
      - run: npm run size
      - name: Package hosted distribution
        run: tar -C dist-hosted -czf tabs-chat-hosted.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabs-chat-standalone
          path: |
            dist/tabs-chat.html
            dist/tabs-chat-lite.html
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabs-chat-hosted
          path: tabs-chat-hosted.tar.gz
          if-no-files-found: error
